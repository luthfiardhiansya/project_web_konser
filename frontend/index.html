<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>InfoMusikBDG — Temukan Event Musik Bandung</title>

    <meta
      name="description"
      content="Temukan konser, gigs, festival, musisi, venue, dan berbagai event musik terbaru di Bandung hanya di InfoMusikBDG."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bgWarm: '#FAF7F0',
              brandPurple: '#7E22CE',
              brandPurpleLight: '#A855F7',
              brandYellow: '#FFDE59',
              brandCyan: '#00F0FF',
              brandCoral: '#FF5757',
              brandGreen: '#00E676',
              brandDark: '#121212'
            },

            fontFamily: {
              jakarta: ['Plus Jakarta Sans', 'sans-serif'],
              grotesk: ['Space Grotesk', 'sans-serif']
            },

            boxShadow: {
              neo: '6px 6px 0px #000',
              'neo-lg': '10px 10px 0px #000'
            }
          }
        }
      }
    </script>
  </head>

  <body class="bg-bgWarm text-black font-jakarta">
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
